name: ACP semantic, canonical and change contracts

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
        with:
          # Preservation tests compare approved bytes against the accepted checkpoint.
          fetch-depth: 0
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.14.7'
          cache: pip
          cache-dependency-path: tooling/requirements.txt
      - name: Install pinned contract tooling
        run: python3.14 -m pip install -r tooling/requirements.txt
      - uses: actions/setup-node@v7
        with:
          node-version: '24.21.0'
          package-manager-cache: false
      - name: Check dependency consistency
        run: python3.14 -m pip check
      - name: Check documentation and repository contracts
        run: python3.14 tooling/check_repository.py
      - name: Validate all schemas, corpora, history and recovery tests
        run: python3.14 -m unittest discover -s tooling/tests -v
      - name: Independently verify canonical bytes and hashes
        run: node tooling/check_canonical_vectors.mjs
      - name: Independently verify Canonical 0.2 execution vectors
        run: node tooling/check_canonical_vectors.mjs test-corpus/execution-v03
      - name: Independently verify proposed Canonical 0.3 bytes and hashes
        run: node tooling/check_canonical_vectors.mjs test-corpus/deterministic-v04
  phase5-experiments:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.14.7'
      - uses: actions/setup-node@v7
        with:
          node-version: '24.21.0'
          package-manager-cache: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25.0.0'
      - name: Retain alternate JDK for controlled Phase 5C comparison
        run: echo "ACP5C_JAVA_UPGRADE_HOME=$JAVA_HOME" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21.0.0'
      - name: Install pinned reference and frontend dependencies
        run: |
          python3.14 -m pip install -r tooling/requirements.txt
          npm --prefix experiments/phase5/langium ci --ignore-scripts --no-audit --no-fund
          mvn -B -ntp -f experiments/phase5/xtext/pom.xml -Dmaven.repo.local="$GITHUB_WORKSPACE/experiments/phase5/.cache/m2" dependency:build-classpath -Dmdep.outputFile=target/classpath.txt
          python3.14 experiments/phase5/setup.py
      - name: Build all three actual ACP grammars
        run: |
          python3.14 experiments/phase5/generate.py
          python3.14 experiments/phase5/build.py antlr
          python3.14 experiments/phase5/build.py xtext
          npm --prefix experiments/phase5/langium run generate
          npm --prefix experiments/phase5/langium run build
          python3.14 experiments/phase5/native_build.py
      - name: Verify frontend interchange, diagnostics, determinism and Java bytes
        run: |
          python3.14 experiments/phase5/regression.py
          python3.14 experiments/phase5/smoke.py
      - name: Verify pinned Rust canonical interoperability and graph slice
        run: |
          rustup toolchain install 1.90.0 --profile minimal
          cargo +1.90.0 run --locked --release --manifest-path experiments/phase5/core-runtime/Cargo.toml -- test-corpus/canonical
          rustc +1.90.0 --edition=2024 -O experiments/phase5/core-runtime/core.rs -o experiments/phase5/core-runtime/out/core
          experiments/phase5/core-runtime/out/core 1000
      - name: Exercise native editor and source-analysis APIs
        run: |
          python3.14 experiments/phase5/native.py
          node experiments/phase5/langium/editor-probe.mjs
          node experiments/phase5/langium/source-probe.mjs
      - name: Verify Phase 5B wire, source, diagnostics, determinism and scale evidence
        run: |
          python3.14 experiments/phase5/wire.py
          python3.14 experiments/phase5/source5b.py
          python3.14 experiments/phase5/evidence5b.py
          python3.14 experiments/phase5/scale5b.py
          python3.14 experiments/phase5/inventory5b.py
      - name: Reproduce controlled frontend upgrades from isolated locks
        run: |
          python3.14 experiments/phase5/evolution.py prepare
          npm --prefix experiments/phase5/.cache/evolution/langium ci --ignore-scripts --no-audit --no-fund
          mvn -B -ntp -f experiments/phase5/.cache/evolution/xtext/pom.xml -Dmaven.repo.local="$GITHUB_WORKSPACE/experiments/phase5/.cache/m2" dependency:build-classpath -Dmdep.outputFile=target/classpath.txt
          python3.14 experiments/phase5/evolution.py
      - name: Verify Phase 5C native persistence, fault parity and toolchain evidence
        run: |
          python3.14 experiments/phase5/run5c.py
          python3.14 experiments/phase5/fault5c.py
          python3.14 experiments/phase5/measure5c.py
          rustup toolchain install 1.89.0 --profile minimal
          cargo +1.90.0 fetch --locked --manifest-path experiments/phase5/core-runtime/Cargo.toml
          mkdir -p experiments/phase5/.cache/phase5c-toolchains
          curl --fail --silent --show-error --max-time 120 https://nodejs.org/dist/v22.20.0/node-v22.20.0-linux-x64.tar.xz -o experiments/phase5/.cache/phase5c-toolchains/node-v22.20.0-linux-x64.tar.xz
          curl --fail --silent --show-error --max-time 120 https://nodejs.org/dist/v22.20.0/SHASUMS256.txt -o experiments/phase5/.cache/phase5c-toolchains/node-v22.20.0-SHASUMS256.txt
          curl --fail --silent --show-error --max-time 120 https://repo.maven.apache.org/maven2/org/antlr/antlr-runtime/3.2/antlr-runtime-3.2-sources.jar -o experiments/phase5/.cache/phase5c-toolchains/antlr-runtime-3.2-sources.jar
          python3.14 experiments/phase5/verify_node_archive5c.py
          tar -xJf experiments/phase5/.cache/phase5c-toolchains/node-v22.20.0-linux-x64.tar.xz -C experiments/phase5/.cache/phase5c-toolchains
          python3.14 experiments/phase5/maintenance5c.py
          python3.14 experiments/phase5/check5c.py
      - name: Preserve Phase 5C hosted evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase5c-ubuntu-evidence
          path: experiments/phase5/results/phase5c/
      - name: Preserve hosted evidence separately from laptop measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase5b-ubuntu-evidence
          path: experiments/phase5/results/phase5b/

  phase5c-hard-gates:
    needs: [contracts, phase5-experiments]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.14.7'
      - uses: actions/download-artifact@v4
        with:
          name: phase5c-ubuntu-evidence
          path: experiments/phase5/results/phase5c/
      - name: Verify actual Ubuntu evidence and honest unresolved-gate disposition
        run: python3.14 experiments/phase5/check5c.py

  phase6-target:
    needs: [contracts, phase5c-hard-gates]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_DB: acp_test
          POSTGRES_USER: acp_test
          POSTGRES_PASSWORD: ephemeral-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U acp_test -d acp_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      ACP_TEST_DATABASE_URL: jdbc:postgresql://127.0.0.1:5432/acp_test
      ACP_TEST_DATABASE_USER: acp_test
      ACP_TEST_DATABASE_PASSWORD: ephemeral-test-only
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.14.7'
      - uses: actions/setup-node@v7
        with:
          node-version: '24.21.0'
          package-manager-cache: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Install contract dependencies and worker confinement library
        run: |
          sudo apt-get update
          sudo apt-get install --yes libseccomp2
          python3.14 -m pip install -r tooling/requirements.txt
      - name: Compile both complete approved domains through the negotiated target
        # Assert the exact reviewed open-phase state; strict closure mode remains available.
        # Any added or removed blocker, earlier-stage failure or wrong snapshot fails.
        run: python3.14 tooling/check_phase6_target.py --output /tmp/acp-phase6-target --run-builds --expect-open-blockers
      - name: Verify isolated typed components without claiming target admission
        run: python3.14 tooling/check_execution_components.py --output /tmp/acp-phase6-components --run-builds
      - name: Verify approved Canonical 0.2 and ChangeSet 0.2 evolution boundaries
        run: python3.14 -m unittest tooling.tests.test_execution_approval tooling.tests.test_execution_v03_evolution -v
      - name: Preserve negotiated gate and generated build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase6-target-ubuntu-evidence
          path: |
            /tmp/acp-phase6-target/negotiated-report.json
            /tmp/acp-phase6-target/*.log
            /tmp/acp-phase6-components/component-report.json
            /tmp/acp-phase6-components/*.log
