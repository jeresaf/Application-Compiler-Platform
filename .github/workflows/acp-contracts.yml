name: ACP semantic, canonical and change contracts

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
        with:
          # Preservation tests compare approved bytes against the accepted checkpoint.
          fetch-depth: 0
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.14.7'
          cache: pip
          cache-dependency-path: tooling/requirements.txt
      - name: Install pinned contract tooling
        run: python3.14 -m pip install -r tooling/requirements.txt
      - uses: actions/setup-node@v7
        with:
          node-version: '24.21.0'
          package-manager-cache: false
      - name: Check dependency consistency
        run: python3.14 -m pip check
      - name: Verify CI parity and fail-closed aggregation regressions
        run: python3.14 -m unittest discover -s verification/ci -v
      - name: Check documentation and repository contracts
        run: python3.14 tooling/check_repository.py
      - name: Validate all schemas, corpora, history and recovery tests
        run: python3.14 -m unittest discover -s tooling/tests -v
      - name: Install isolated Route A engineering dependencies
        run: |
          python3.14 -m venv engineering/route_a_gateway/.venv
          engineering/route_a_gateway/.venv/bin/python3.14 -m pip install -r tooling/requirements.txt
          engineering/route_a_gateway/.venv/bin/python3.14 -m pip install --require-hashes -r engineering/route_a_gateway/requirements.txt
          engineering/route_a_gateway/.venv/bin/python3.14 -m pip check
      - name: Verify Route A replay, symbolic contracts and isolated authenticated integration
        shell: bash
        run: |
          set -o pipefail
          mkdir -p .audit-artifacts/route-a-engineering
          engineering/route_a_gateway/.venv/bin/python3.14 -m unittest discover -s verification/route_a -v 2>&1 | tee .audit-artifacts/route-a-engineering/tests.log
      - name: Independently verify canonical bytes and hashes
        run: node tooling/check_canonical_vectors.mjs
      - name: Independently verify Canonical 0.2 execution vectors
        run: node tooling/check_canonical_vectors.mjs test-corpus/execution-v03
      - name: Independently verify approved Canonical 0.3 bytes and hashes
        run: node tooling/check_canonical_vectors.mjs test-corpus/deterministic-v04
      - name: Retain Route A engineering test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: route-a-engineering-test-evidence
          path: .audit-artifacts/route-a-engineering/
          if-no-files-found: warn
      - name: Bind fresh job evidence to exact source and attempt
        if: always()
        run: python3.14 engineering/ci/aggregate.py capture
      - name: Retain exact-source job binding
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-source-contracts
          path: .ci-evidence/contracts.json
          if-no-files-found: error
      - name: Verify Stage 1 evidence contract structures
        run: python3.14 -m unittest discover -s verification/evidence_admission -v
      - name: Install isolated Stage 2A laboratory dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3.14 -m venv "$RUNNER_TEMP/acp-stage2a-venv"
          "$RUNNER_TEMP/acp-stage2a-venv/bin/python3.14" -m pip install --require-hashes --only-binary=:all: --report "$RUNNER_TEMP/acp-stage2a-install.json" -r engineering/evidence_admission/requirements.txt
          "$RUNNER_TEMP/acp-stage2a-venv/bin/python3.14" -m pip check
          "$RUNNER_TEMP/acp-stage2a-venv/bin/python3.14" -m pip list --format=json > "$RUNNER_TEMP/acp-stage2a-packages.json"
          cat "$RUNNER_TEMP/acp-stage2a-packages.json"
          "$RUNNER_TEMP/acp-stage2a-venv/bin/python3.14" - <<'PYTHON'
          import importlib.metadata as metadata
          import json, os, platform
          from pathlib import Path
          from cryptography.hazmat.backends.openssl.backend import backend
          assert platform.python_version() == '3.14.7', 'WRONG_PYTHON'
          requirements = Path('engineering/evidence_admission/requirements.txt').read_text().splitlines()
          expected = dict(line.split()[0].split('==') for line in requirements if line and not line.startswith('#'))
          for name, version in expected.items():
              assert metadata.version(name) == version, ('WRONG_PACKAGE', name)
          report = json.loads((Path(os.environ['RUNNER_TEMP']) / 'acp-stage2a-install.json').read_text())
          installed = report['install']
          assert len(installed) == len(expected), 'INCOMPLETE_WHEEL_INSTALL'
          for item in installed:
              download = item['download_info']
              assert download['url'].split('?')[0].endswith('.whl'), 'SOURCE_BUILD_FORBIDDEN'
              assert 'sha256' in download['archive_info']['hashes'], 'MISSING_WHEEL_HASH'
          openssl = backend.openssl_version_text()
          assert openssl == 'OpenSSL 4.0.3 29 Sep 2026', ('WRONG_BUNDLED_OPENSSL', openssl)
          print(json.dumps({'python': platform.python_version(), 'lockedPackages': expected, 'bundledOpenSSL': openssl}, sort_keys=True))
          PYTHON
      - name: Verify Stage 2A laboratory verifier registration
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/acp-stage2a-venv/bin/python3.14" - <<'PYTHON'
          import unittest
          from pathlib import Path
          directory = Path('verification/evidence_admission/stage2a')
          expected = {'test_signatures.py', 'test_trust.py', 'test_registration.py'}
          assert {path.name for path in directory.glob('test*.py')} == expected, 'STAGE2A_TEST_FILES'
          suite = unittest.defaultTestLoader.discover(str(directory))
          assert suite.countTestCases() == 52, 'STAGE2A_TEST_COUNT'
          PYTHON
          "$RUNNER_TEMP/acp-stage2a-venv/bin/python3.14" -m unittest discover -s verification/evidence_admission/stage2a -v

  phase5-experiments:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.14.7'
      - uses: actions/setup-node@v7
        with:
          node-version: '24.21.0'
          package-manager-cache: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25.0.0'
      - name: Retain alternate JDK for controlled Phase 5C comparison
        run: echo "ACP5C_JAVA_UPGRADE_HOME=$JAVA_HOME" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21.0.0'
      - name: Install pinned reference and frontend dependencies
        run: |
          python3.14 -m pip install -r tooling/requirements.txt
          npm --prefix experiments/phase5/langium ci --ignore-scripts --no-audit --no-fund
          mvn -B -ntp -f experiments/phase5/xtext/pom.xml -Dmaven.repo.local="$GITHUB_WORKSPACE/experiments/phase5/.cache/m2" dependency:build-classpath -Dmdep.outputFile=target/classpath.txt
          python3.14 experiments/phase5/setup.py
      - name: Build all three actual ACP grammars
        run: |
          python3.14 experiments/phase5/generate.py
          python3.14 experiments/phase5/build.py antlr
          python3.14 experiments/phase5/build.py xtext
          npm --prefix experiments/phase5/langium run generate
          npm --prefix experiments/phase5/langium run build
          python3.14 experiments/phase5/native_build.py
      - name: Verify frontend interchange, diagnostics, determinism and Java bytes
        run: |
          python3.14 experiments/phase5/regression.py
          python3.14 experiments/phase5/smoke.py
      - name: Verify pinned Rust canonical interoperability and graph slice
        run: |
          rustup toolchain install 1.90.0 --profile minimal
          cargo +1.90.0 run --locked --release --manifest-path experiments/phase5/core-runtime/Cargo.toml -- test-corpus/canonical
          rustc +1.90.0 --edition=2024 -O experiments/phase5/core-runtime/core.rs -o experiments/phase5/core-runtime/out/core
          experiments/phase5/core-runtime/out/core 1000
      - name: Exercise native editor and source-analysis APIs
        run: |
          python3.14 experiments/phase5/native.py
          node experiments/phase5/langium/editor-probe.mjs
          node experiments/phase5/langium/source-probe.mjs
      - name: Verify Phase 5B wire, source, diagnostics, determinism and scale evidence
        run: |
          python3.14 experiments/phase5/wire.py
          python3.14 experiments/phase5/source5b.py
          python3.14 experiments/phase5/evidence5b.py
          python3.14 experiments/phase5/scale5b.py
          python3.14 experiments/phase5/inventory5b.py
      - name: Reproduce controlled frontend upgrades from isolated locks
        run: |
          python3.14 experiments/phase5/evolution.py prepare
          npm --prefix experiments/phase5/.cache/evolution/langium ci --ignore-scripts --no-audit --no-fund
          mvn -B -ntp -f experiments/phase5/.cache/evolution/xtext/pom.xml -Dmaven.repo.local="$GITHUB_WORKSPACE/experiments/phase5/.cache/m2" dependency:build-classpath -Dmdep.outputFile=target/classpath.txt
          python3.14 experiments/phase5/evolution.py
      - name: Verify Phase 5C native persistence, fault parity and toolchain evidence
        run: |
          python3.14 experiments/phase5/run5c.py
          python3.14 experiments/phase5/fault5c.py
          python3.14 experiments/phase5/measure5c.py
          rustup toolchain install 1.89.0 --profile minimal
          cargo +1.90.0 fetch --locked --manifest-path experiments/phase5/core-runtime/Cargo.toml
          mkdir -p experiments/phase5/.cache/phase5c-toolchains
          curl --fail --silent --show-error --max-time 120 https://nodejs.org/dist/v22.20.0/node-v22.20.0-linux-x64.tar.xz -o experiments/phase5/.cache/phase5c-toolchains/node-v22.20.0-linux-x64.tar.xz
          curl --fail --silent --show-error --max-time 120 https://nodejs.org/dist/v22.20.0/SHASUMS256.txt -o experiments/phase5/.cache/phase5c-toolchains/node-v22.20.0-SHASUMS256.txt
          curl --fail --silent --show-error --max-time 120 https://repo.maven.apache.org/maven2/org/antlr/antlr-runtime/3.2/antlr-runtime-3.2-sources.jar -o experiments/phase5/.cache/phase5c-toolchains/antlr-runtime-3.2-sources.jar
          python3.14 experiments/phase5/verify_node_archive5c.py
          tar -xJf experiments/phase5/.cache/phase5c-toolchains/node-v22.20.0-linux-x64.tar.xz -C experiments/phase5/.cache/phase5c-toolchains
          python3.14 experiments/phase5/maintenance5c.py
          python3.14 experiments/phase5/check5c.py
      - name: Preserve Phase 5C hosted evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase5c-ubuntu-evidence
          path: experiments/phase5/results/phase5c/
      - name: Preserve hosted evidence separately from laptop measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase5b-ubuntu-evidence
          path: experiments/phase5/results/phase5b/

      - name: Bind fresh job evidence to exact source and attempt
        if: always()
        run: python3.14 engineering/ci/aggregate.py capture
      - name: Retain exact-source job binding
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-source-phase5-experiments
          path: .ci-evidence/phase5-experiments.json
          if-no-files-found: error

  phase5c-hard-gates:
    needs: [contracts, phase5-experiments]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.14.7'
      - uses: actions/download-artifact@v4
        with:
          name: phase5c-ubuntu-evidence
          path: experiments/phase5/results/phase5c/
      - name: Verify actual Ubuntu evidence and honest unresolved-gate disposition
        run: python3.14 experiments/phase5/check5c.py

      - name: Bind fresh job evidence to exact source and attempt
        if: always()
        run: python3.14 engineering/ci/aggregate.py capture
      - name: Retain exact-source job binding
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-source-phase5c-hard-gates
          path: .ci-evidence/phase5c-hard-gates.json
          if-no-files-found: error

  phase6-target:
    needs: [contracts, phase5c-hard-gates]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_DB: acp_test
          POSTGRES_USER: acp_test
          POSTGRES_PASSWORD: ephemeral-test-only-target
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U acp_test -d acp_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      ACP_TEST_DATABASE_URL: jdbc:postgresql://127.0.0.1:5432/acp_test
      ACP_TEST_DATABASE_USER: acp_test
      ACP_TEST_DATABASE_PASSWORD: ephemeral-test-only-target
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.14.7'
      - uses: actions/setup-node@v7
        with:
          node-version: '24.21.0'
          package-manager-cache: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Install contract dependencies and worker confinement library
        run: |
          sudo apt-get update
          sudo apt-get install --yes libseccomp2
          python3.14 -m pip install -r tooling/requirements.txt
      - name: Verify successor generator release identity and packaged tzdb
        run: |
          python3.14 tooling/check_target_release.py
          python3.14 tooling/package_target_tzdb.py --check
      - name: Enable authoritative PostgreSQL commit evidence for idempotency
        run: |
          docker exec "${{ job.services.postgres.id }}" psql -U acp_test -d acp_test -c "ALTER SYSTEM SET track_commit_timestamp = on"
          docker restart "${{ job.services.postgres.id }}"
          for attempt in $(seq 1 30); do
            if docker exec "${{ job.services.postgres.id }}" pg_isready -U acp_test -d acp_test; then break; fi
            sleep 1
          done
          docker exec "${{ job.services.postgres.id }}" psql -U acp_test -d acp_test -c "SHOW track_commit_timestamp"
      - name: Compile both complete approved domains through the negotiated target
        # Full admission requires real generation, builds, PostgreSQL and browser.
        # Phase 6 final closure review remains independently outstanding.
        run: python3.14 tooling/tests/phase6_gates.py target --output /tmp/acp-phase6-target --run-builds --full-admission
      - name: Verify identity clearing and logical recovery keys
        run: |
          for domain in payment case-management; do
            cp tooling/tests/task_ui_identity_race.ts "/tmp/acp-phase6-target/$domain/frontend/src/identity-race.test.ts"
            cp tooling/tests/task_ui_retry.ts "/tmp/acp-phase6-target/$domain/frontend/src/ui-recovery.test.ts"
            npm --prefix "/tmp/acp-phase6-target/$domain/frontend" test -- src/identity-race.test.ts src/ui-recovery.test.ts
          done
      - name: Verify exact HTTP outcomes through the production browser
        run: python3.14 tooling/tests/task_ui_http_outcomes.py --root /tmp/acp-phase6-target
      - name: Verify actual sealed 0.3 upgrade without database changes
        run: python3.14 tooling/tests/task_ui_upgrade.py --output /tmp/acp-ui-profile-upgrade --new-projects /tmp/acp-phase6-target
      - name: Verify isolated typed components without claiming target admission
        run: python3.14 tooling/check_execution_components.py --output /tmp/acp-phase6-components --run-builds
      - name: Verify approved Canonical 0.3 invocation runtime against PostgreSQL and HTTP
        run: python3.14 tooling/check_invocation_components.py --output /tmp/acp-invocation-components --run-builds
      - name: Verify durable delivery and scheduling against PostgreSQL
        run: python3.14 tooling/tests/delivery_components.py --output /tmp/acp-delivery-job-components --run-builds
      - name: Verify privacy lifecycle, redaction, deployment obligations and concurrent disposal
        run: python3.14 tooling/tests/phase6_gates.py privacy --output /tmp/acp-privacy-lifecycle-components --run-builds
      - name: Upgrade actual accepted target 0.2 applications and exercise lifecycle in place
        run: python3.14 tooling/check_privacy_profile_upgrade.py --output /tmp/acp-privacy-profile-upgrade --new-projects /tmp/acp-privacy-lifecycle-components
      - name: Verify forensic target 0.1 upgrade evidence outside production support window
        run: python3.14 tooling/tests/invocation_upgrade.py --output /tmp/acp-target-profile-upgrade --new-projects /tmp/acp-delivery-job-components
      - name: Verify approved Canonical 0.3 evolution and exact approval boundaries
        run: python3.14 -m unittest tooling.tests.test_deterministic_approval tooling.tests.test_invocation_target tooling.tests.test_delivery_job_target tooling.tests.test_privacy_lifecycle_target tooling.tests.test_task_interface -v
      - name: Verify approved Canonical 0.2 and ChangeSet 0.2 evolution boundaries
        run: python3.14 -m unittest tooling.tests.test_execution_approval tooling.tests.test_execution_v03_evolution -v
      - name: Preserve negotiated gate and generated build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase6-target-ubuntu-evidence
          path: |
            /tmp/acp-phase6-target/task-interface-report.json
            /tmp/acp-phase6-target/supplemental-http/
            /tmp/acp-phase6-target/*/frontend/browser-results.json
            /tmp/acp-phase6-target/*/frontend/test-results/
            /tmp/acp-ui-profile-upgrade/ui-upgrade-report.json
            /tmp/acp-ui-profile-upgrade/*.log
            /tmp/acp-phase6-target/*.log
            /tmp/acp-phase6-components/component-report.json
            /tmp/acp-phase6-components/*.log
            /tmp/acp-invocation-components/invocation-report.json
            /tmp/acp-invocation-components/*.log
            /tmp/acp-invocation-components/*/backend/target/surefire-reports/
            /tmp/acp-delivery-job-components/delivery-job-report.json
            /tmp/acp-delivery-job-components/*.log
            /tmp/acp-delivery-job-components/*/backend/target/surefire-reports/
            /tmp/acp-target-profile-upgrade/target-upgrade-report.json
            /tmp/acp-target-profile-upgrade/*.log
            /tmp/acp-target-profile-upgrade/old-projects/*/backend/target/surefire-reports/
            /tmp/acp-privacy-lifecycle-components/privacy-lifecycle-report.json
            /tmp/acp-privacy-lifecycle-components/*.log
            /tmp/acp-privacy-lifecycle-components/*/backend/target/surefire-reports/
            /tmp/acp-privacy-lifecycle-components/*/acp/deployment-requirements.json
            /tmp/acp-privacy-profile-upgrade/target-upgrade-report.json
            /tmp/acp-privacy-profile-upgrade/*.log
            /tmp/acp-privacy-profile-upgrade/old-projects/*/backend/target/surefire-reports/

      - name: Bind fresh job evidence to exact source and attempt
        if: always()
        run: python3.14 engineering/ci/aggregate.py capture
      - name: Retain exact-source job binding
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-source-phase6-target
          path: .ci-evidence/phase6-target.json
          if-no-files-found: error

  phase6-closure-audit:
    needs: [contracts, phase5c-hard-gates]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_DB: acp_test
          POSTGRES_USER: acp_test
          POSTGRES_PASSWORD: ephemeral-test-only-closure
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U acp_test -d acp_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      ACP_TEST_DATABASE_URL: jdbc:postgresql://127.0.0.1:5432/acp_test
      ACP_TEST_DATABASE_USER: acp_test
      ACP_TEST_DATABASE_PASSWORD: ephemeral-test-only-closure
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.14.7'
      - uses: actions/setup-node@v7
        with:
          node-version: '24.21.0'
          package-manager-cache: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install exact audit generation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libseccomp2 postgresql-client openssl
          python3.14 -m pip install -r tooling/requirements.txt
      - name: Enable authoritative commit evidence
        run: |
          docker exec "${{ job.services.postgres.id }}" psql -U acp_test -d acp_test -c "ALTER SYSTEM SET track_commit_timestamp = on"
          docker restart "${{ job.services.postgres.id }}"
          for attempt in $(seq 1 30); do
            if docker exec "${{ job.services.postgres.id }}" pg_isready -U acp_test -d acp_test; then break; fi
            sleep 1
          done
          docker exec "${{ job.services.postgres.id }}" psql -U acp_test -d acp_test -c "SHOW track_commit_timestamp"
      - name: Perform successor closure audit without waivers
        # Exit 1 is an execution exception; exit 2 is PHASE6_CLOSURE_BLOCKED; do not hide it or mark Phase 6 closed.
        run: python3.14 tooling/audit/phase6.py --output /tmp/acp-phase6-final-audit
      - name: Retain dated vulnerability advisory details
        if: always()
        run: python3.14 tooling/audit/security_review.py --source /tmp/acp-phase6-final-audit
      - name: Preserve closure recommendation and complete evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase6-remediation-0.5.0-closure-audit
          path: |
            /tmp/acp-phase6-final-audit/*.json
            /tmp/acp-phase6-final-audit/*.log
            /tmp/acp-phase6-final-audit/*-production-1.tar
            /tmp/acp-phase6-final-audit/admission/task-interface-report.json
            /tmp/acp-phase6-final-audit/admission/*.log
            /tmp/acp-phase6-final-audit/admission/supplemental-http/
            /tmp/acp-phase6-final-audit/admission/*/frontend/browser-results.json
            /tmp/acp-phase6-final-audit/admission/*/frontend/test-results/
            /tmp/acp-phase6-final-audit/admission/*/backend/target/surefire-reports/
            /tmp/acp-phase6-final-audit/oidc/

      - name: Bind fresh job evidence to exact source and attempt
        if: always()
        run: python3.14 engineering/ci/aggregate.py capture
      - name: Retain exact-source job binding
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-source-phase6-closure-audit
          path: .ci-evidence/phase6-closure-audit.json
          if-no-files-found: error

  final-ci-aggregate:
    if: always()
    needs: [contracts, phase5-experiments, phase5c-hard-gates, phase6-target, phase6-closure-audit]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.14.7'
      - name: Verify actual conclusions and exact-source artifacts
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_NEEDS: ${{ toJSON(needs) }}
        run: python3.14 engineering/ci/aggregate.py hosted
      - name: Preserve aggregation, test inventories and timing
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-ci-aggregate-evidence
          path: .ci-evidence/
          include-hidden-files: true
          if-no-files-found: error
