name: ACP Phase 11 H3 bounded capacity
on:
  push:
    branches: ['codex/phase11-hardening']
  pull_request:
    paths:
      - 'engineering/capacity/**'
      - 'verification/capacity/**'
      - '.github/workflows/phase11-h3.yml'
permissions:
  contents: read
jobs:
  h3-capacity:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    env:
      PYTHONPATH: tooling:.
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.14.7'
      - uses: actions/setup-node@v7
        with:
          node-version: '24.21.0'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Isolated hash-locked compiler and SDK
        run: |
          set -euo pipefail
          python3.14 -m venv "$RUNNER_TEMP/acp-h3-venv"
          "$RUNNER_TEMP/acp-h3-venv/bin/python3.14" -m pip install --require-hashes --only-binary=:all: -r engineering/mcp_adapter/requirements.txt
          "$RUNNER_TEMP/acp-h3-venv/bin/python3.14" -m pip check
      - name: Exact H3 and existing H1 H2 regressions without skips
        run: |
          set -euo pipefail
          for pair in verification/capacity:46 verification/hardening:20 verification/reliability:45; do
            "$RUNNER_TEMP/acp-h3-venv/bin/python3.14" -B - "${pair%:*}" "${pair##*:}" <<'PYTHON'
          import sys,unittest
          suite=unittest.defaultTestLoader.discover(sys.argv[1]);count=int(sys.argv[2])
          assert suite.countTestCases()==count
          result=unittest.TextTestRunner(verbosity=2).run(suite)
          assert result.wasSuccessful() and result.testsRun==count and not result.skipped
          PYTHON
          done
      - name: Exact disposable PostgreSQL 18.6
        run: docker pull postgres@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
      - name: Actual generated application capacity and resource qualification
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/acp-h3-venv/bin/python3.14" -B -m engineering.capacity.run --workspace "$RUNNER_TEMP/acp-h3" 2>&1 | tee "$RUNNER_TEMP/acp-h3.log"
      - name: Exact source identities measurements invariants and cleanup
        run: |
          "$RUNNER_TEMP/acp-h3-venv/bin/python3.14" -B - <<'PYTHON'
          import hashlib,json,os,platform,subprocess
          from pathlib import Path
          from engineering.capacity.verification import validate
          from engineering.capacity.run import source_inventory
          from engineering.hardening.target import HardeningTarget
          r=validate(json.loads((Path(os.environ['RUNNER_TEMP'])/'acp-h3/result.json').read_bytes()))
          assert r['sourceCommit']==subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()==os.environ['GITHUB_SHA']
          assert platform.python_version()==r['environment']['python']=='3.14.7'
          assert r['environment']['system']=='Linux' and 'VERSION_ID="24.04"' in r['environment']['osRelease']
          assert r['generator']==HardeningTarget().descriptor() and r['sourceSHA256']==source_inventory()
          assert r['canonicalDigest']==json.loads(Path('proposals/phase10-r7-jobs/candidate.json').read_bytes())['contentDigest']
          assert [x['clients'] for x in r['levels']]==[4,8,16]
          assert r['cleanup']=='VERIFIED' and r['G22']=='NOT_SATISFIED'
          assert r['productionCapacity']=='NOT_APPROVED' and r['releaseClosure']=='BLOCKED'
          PYTHON
      - name: Preserve successful measurements source and database evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: phase11-h3-capacity
          include-hidden-files: true
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/acp-h3.log
            ${{ runner.temp }}/acp-h3/
            !${{ runner.temp }}/acp-h3/**/node_modules/**
            !${{ runner.temp }}/acp-h3/**/target/**
            !${{ runner.temp }}/acp-h3/**/m2/**
            !${{ runner.temp }}/acp-h3/**/npm/**
            !${{ runner.temp }}/acp-h3/**/browsers/**
      - name: Retain closed redacted failure diagnostics
        if: failure()
        run: |
          "$RUNNER_TEMP/acp-h3-venv/bin/python3.14" -B -m engineering.operations.diagnostics --workspace "$RUNNER_TEMP/acp-h3" --output "$RUNNER_TEMP/acp-h3-failure-public"
      - name: Preserve redacted failure only
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: phase11-h3-failure
          if-no-files-found: error
          path: ${{ runner.temp }}/acp-h3-failure-public/
