name: ACP Phase 10 R2 synthetic preview
on:
  push:
    branches: ['codex/phase10-reference-application']
  pull_request:
    paths:
      - 'engineering/reference_application/**'
      - 'verification/reference_application/**'
      - '.github/workflows/phase10-r2.yml'
permissions:
  contents: read
  actions: read
jobs:
  case-management-r2:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.14.7'
      - uses: actions/setup-node@v7
        with:
          node-version: '24.21.0'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Isolated locked SDK and compiler inputs
        shell: bash
        run: |
          set -euo pipefail
          python3.14 -m venv "$RUNNER_TEMP/acp-reference-venv"
          "$RUNNER_TEMP/acp-reference-venv/bin/python3.14" -m pip install --require-hashes --only-binary=:all: -r engineering/mcp_adapter/requirements.txt
          "$RUNNER_TEMP/acp-reference-venv/bin/python3.14" -m pip check
      - name: Exact disposable database runtime
        run: docker pull postgres@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
      - name: Focused R2 proposal and rejection tests
        run: |
          "$RUNNER_TEMP/acp-reference-venv/bin/python3.14" -B - <<'PYTHON'
          import unittest
          suite=unittest.defaultTestLoader.discover('verification/reference_application',pattern='test_evolution.py')
          assert suite.countTestCases()==10
          result=unittest.TextTestRunner(verbosity=2).run(suite)
          assert result.wasSuccessful() and result.testsRun==10 and not result.skipped
          PYTHON
      - name: Actual generated application and synthetic staged migration
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/acp-reference-venv/bin/python3.14" -B -m engineering.reference_application.evolution --workspace "$RUNNER_TEMP/acp-r2" 2>&1 | tee "$RUNNER_TEMP/acp-r2.log"
      - name: Retain exact preview source SQL and runtime observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase10-r2-preview
          path: |
            ${{ runner.temp }}/acp-r2.log
            ${{ runner.temp }}/acp-r2/**/*.json
            ${{ runner.temp }}/acp-r2/**/*.sql
            ${{ runner.temp }}/acp-r2/**/*.log
            ${{ runner.temp }}/acp-r2/build/
            ${{ runner.temp }}/acp-r2/runtime/
            ${{ runner.temp }}/acp-r2-inputs/owner.json
            !${{ runner.temp }}/acp-r2/application/frontend/node_modules/**
          if-no-files-found: error
