name: ACP Phase 10 R4 native CREATE
on:
  push:
    branches: ['codex/phase10-reference-application']
  pull_request:
    paths:
      - 'engineering/native_create/**'
      - 'contracts/native-create/**'
      - 'verification/native_create/**'
      - '.github/workflows/phase10-r4.yml'
permissions:
  contents: read
  actions: read
jobs:
  case-management-r4:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.14.7'
      - uses: actions/setup-node@v7
        with:
          node-version: '24.21.0'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Isolated locked SDK and compiler inputs
        shell: bash
        run: |
          set -euo pipefail
          python3.14 -m venv "$RUNNER_TEMP/acp-reference-venv"
          "$RUNNER_TEMP/acp-reference-venv/bin/python3.14" -m pip install --require-hashes --only-binary=:all: -r engineering/mcp_adapter/requirements.txt
          "$RUNNER_TEMP/acp-reference-venv/bin/python3.14" -m pip check
      - name: Exact disposable database runtime
        run: docker pull postgres@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
      - name: Focused native CREATE and rejection tests
        run: |
          "$RUNNER_TEMP/acp-reference-venv/bin/python3.14" -B - <<'PYTHON'
          import unittest
          suite=unittest.defaultTestLoader.discover('verification/native_create')
          assert suite.countTestCases()==21
          result=unittest.TextTestRunner(verbosity=2).run(suite)
          assert result.wasSuccessful() and result.testsRun==21 and not result.skipped
          PYTHON
      - name: Native CREATE compiler browser source verification MCP and restart
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/acp-reference-venv/bin/python3.14" -B -m engineering.native_create.run --workspace "$RUNNER_TEMP/acp-r4" 2>&1 | tee "$RUNNER_TEMP/acp-r4.log"
      - name: Retain exact native compilation source and runtime observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase10-r4-native-create
          path: |
            ${{ runner.temp }}/acp-r4.log
            ${{ runner.temp }}/acp-r4/**/*.json
            ${{ runner.temp }}/acp-r4/database/
            ${{ runner.temp }}/acp-r4/**/*.log
            ${{ runner.temp }}/acp-r4/build/
            ${{ runner.temp }}/acp-r4/source-facts/
            ${{ runner.temp }}/acp-r4/runtime/
            ${{ runner.temp }}/acp-r4-inputs/owner.json
            !${{ runner.temp }}/acp-r4/application/frontend/node_modules/**
            !${{ runner.temp }}/acp-r4/build-outputs/frontend/node_modules/**
          if-no-files-found: error
