name: ACP Phase 11 H9 HTTP classification and CREATE diagnostics
on:
  push:
    branches: ['codex/phase11-hardening']
  pull_request:
    paths:
      - 'engineering/http_reliability/**'
      - 'verification/http_reliability/**'
      - '.github/workflows/phase11-h9.yml'
permissions:
  contents: read
jobs:
  h9-http:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      PYTHONPATH: 'tooling:.'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.14.7'
      - uses: actions/setup-node@v7
        with:
          node-version: '24.21.0'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Isolated hash-locked SDK
        run: |
          set -euo pipefail
          python3.14 -m venv "$RUNNER_TEMP/acp-h9-venv"
          "$RUNNER_TEMP/acp-h9-venv/bin/python3.14" -m pip install --require-hashes --only-binary=:all: -r engineering/mcp_adapter/requirements.txt
          "$RUNNER_TEMP/acp-h9-venv/bin/python3.14" -m pip check
      - name: Prior security reliability and capacity regressions without skips
        run: |
          set -euo pipefail
          for pair in verification/identity:15 verification/create_reliability:12 verification/capacity:46 verification/hardening:20 verification/reliability:45; do
            "$RUNNER_TEMP/acp-h9-venv/bin/python3.14" -B - "$pair" <<'PYTHON'
          import sys,unittest
          path,count=sys.argv[1].split(':');count=int(count)
          suite=unittest.defaultTestLoader.discover(path);assert suite.countTestCases()==count
          result=unittest.TextTestRunner(verbosity=2).run(suite)
          assert result.wasSuccessful() and result.testsRun==count and not result.skipped
          PYTHON
          done
      - name: Digest-pinned disposable PostgreSQL 18.6
        run: docker pull postgres@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
      - name: Real baseline successor authentication and finite CREATE study
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/acp-h9-venv/bin/python3.14" -B -m engineering.http_reliability.run --workspace "$RUNNER_TEMP/acp-h9"
      - name: Independently check exact source results cleanup and scope
        run: |
          "$RUNNER_TEMP/acp-h9-venv/bin/python3.14" -B - <<'PYTHON'
          from pathlib import Path
          import os,json,hashlib,platform,subprocess,re
          from engineering.http_reliability.run import inventory,PUBLIC
          from engineering.http_reliability.target import HttpTarget
          from engineering.operations.target import OperationalTarget
          root=Path(os.environ['RUNNER_TEMP'])/'acp-h9-public';r=json.loads((root/'result.json').read_bytes())
          assert r['sourceCommit']==os.environ['GITHUB_SHA']==subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          assert r['executionSourceKind']=='EXACT_GIT_COMMIT'
          assert r['sourceSHA256']==inventory() and platform.python_version()==r['environment']['python']=='3.14.7'
          assert r['baseline']['generator']==OperationalTarget().descriptor() and r['successor']['generator']==HttpTarget().descriptor()
          assert r['baseline']['canonicalDigest']==r['successor']['canonicalDigest']==json.loads(Path('proposals/phase10-r7-jobs/candidate.json').read_bytes())['contentDigest']
          from engineering.generator_candidates.spring_vue_postgres_0_6.candidate import source_digest
          assert source_digest()=='600a552287cc1121be7578c31ba2a379332c9b0d55c60a79b2a5d054c92271aa'
          assert r['baseline']['REL02']=='BASELINE_REPRODUCED' and r['REL02']=='CORRECTED_H9_ONLY'
          assert r['REL01']=='UNRESOLVED_NOT_CAUSALLY_ATTRIBUTED' and r['releaseClosure']=='BLOCKED' and r['phase12']=='NOT_STARTED'
          assert r['focusedTests']=={'tests':16,'failures':0,'skipped':0}
          assert r['cleanup']=='VERIFIED' and all(x['cleanup']=='OWN_CONTAINER_AND_VOLUME_REMOVED' for x in json.loads((root/'resources.json').read_bytes()))
          assert r['sealed05']=='ea19da2aed4182b0f8bc781a2011f949de52a2d4375e67bb7b59346dc75296bb'
          assert r['secretScan']['credentialMatches']==0 and not r['secretScan']['signingKeysExported'] and not r['secretScan']['bearerTokensExported']
          assert set(r['files'])==set(PUBLIC)
          for name,pin in r['files'].items():assert hashlib.sha256((root/name).read_bytes()).hexdigest()==pin
          assert {p.relative_to(root).as_posix() for p in root.rglob('*') if p.is_file()}==set(PUBLIC)|{'result.json'}
          base=json.loads((root/'baseline/runtime-result.json').read_bytes());new=json.loads((root/'successor/runtime-result.json').read_bytes())
          for name in ('unknownAPI','unknownStatic'):
            assert next(x for x in base['http'] if x['case']==name)['response']['status']==500
            assert next(x for x in new['http'] if x['case']==name)['response']['status']==404
            assert next(x for x in new['http'] if x['case']==name)['response']['envelope']=={'code':'RESOURCE_NOT_FOUND','category':'HTTP','retryable':False}
          assert new['submissions']==44 and len(new['attempts'])==44 and len(new['variants'])==9
          assert all(v['postgresSamples'] for v in new['variants'])
          assert all(a['database']['outcome'] in ('COMMITTED','NO_COMMITTED_EFFECT_OBSERVED','INDETERMINATE') for a in new['attempts'])
          assert new['studyOutcome'] in ('NO_REPRODUCTION_OBSERVED','INJECTED_ANALOGOUS_FAILURE','CURRENT_PROFILE_FAILURE_CAUSE_UNRESOLVED')
          crypto=json.loads((root/'crypto-result.json').read_bytes());assert all(x['status']==x['expected'] for x in crypto['outcomes'] if 'status' in x)
          assert all(crypto['sessionRegressions'][k]==0 for k in ('failures','errors','skipped'))
          for p in root.rglob('*'):
            if p.is_file():assert not re.search(rb'eyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}',p.read_bytes()) and b'-----BEGIN PRIVATE KEY-----' not in p.read_bytes()
          PYTHON
      - name: Preserve only verified redacted H9 evidence
        uses: actions/upload-artifact@v4
        with:
          name: phase11-h9-http-reliability
          include-hidden-files: true
          if-no-files-found: error
          path: ${{ runner.temp }}/acp-h9-public/
      - name: Closed failure diagnostics
        if: failure()
        run: |
          "$RUNNER_TEMP/acp-h9-venv/bin/python3.14" -B -m engineering.http_reliability.failure --workspace "$RUNNER_TEMP/acp-h9" --output "$RUNNER_TEMP/acp-h9-failure-public"
      - name: Preserve redacted failed qualification
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: phase11-h9-failure
          if-no-files-found: error
          path: ${{ runner.temp }}/acp-h9-failure-public/
