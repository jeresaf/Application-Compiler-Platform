name: ACP Phase 6 verified V3 offline qualification

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  phase6-v3-offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          # The reviewed commit must be present even on pull-request merge refs.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.14.7'
      - name: Verify preserved patch and reviewed commit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -m 700 "$RUNNER_TEMP/acp-v3-results"
          git cat-file -e '584ca9edce76886ff351fd93edef9d3343a5a61c^{commit}'
          echo '9706ba0c436f57560b0e8ace897cee7f1f258c2d40870e8bf1c9c2da70b791c8  engineering/ci/inputs/phase6-wave3-cumulative.patch' | sha256sum --check --strict
      - name: Provision exact qualification dependencies on disposable runner only
        shell: bash
        run: |
          set -euo pipefail
          python3.14 -c 'import platform; assert platform.python_implementation() == "CPython" and platform.python_version() == "3.14.7", "WRONG_PINNED_PYTHON"'
          git show '584ca9edce76886ff351fd93edef9d3343a5a61c:tooling/requirements.txt' > "$RUNNER_TEMP/acp-v3-requirements.txt"
          echo "36637d22364f7e70895bee4d452b867c6436c6e27a899f65edb6b84aa3f748c2  $RUNNER_TEMP/acp-v3-requirements.txt" | sha256sum --check --strict
          python3.14 -m venv "$RUNNER_TEMP/acp-v3-venv"
          "$RUNNER_TEMP/acp-v3-venv/bin/python3.14" -m pip install --only-binary=:all: -r "$RUNNER_TEMP/acp-v3-requirements.txt" 2>&1 | tee "$RUNNER_TEMP/acp-v3-results/install.log"
          "$RUNNER_TEMP/acp-v3-venv/bin/python3.14" -m pip check
          "$RUNNER_TEMP/acp-v3-venv/bin/python3.14" -m pip list --format=json > "$RUNNER_TEMP/acp-v3-results/packages.json"
      - name: Verify export and fail-closed prerequisite regressions
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/acp-v3-venv/bin/python3.14" -B -m unittest discover -s verification/phase6_v3_ci -v 2>&1 | tee "$RUNNER_TEMP/acp-v3-results/ci-regressions.log"
      - name: Verify unsealed successor engineering candidate
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/acp-v3-venv/bin/python3.14" -B - <<'PYTHON'
          import unittest
          suite = unittest.defaultTestLoader.discover('verification/generator_candidates')
          assert suite.countTestCases() == 13, 'SUCCESSOR_TEST_COUNT'
          PYTHON
          "$RUNNER_TEMP/acp-v3-venv/bin/python3.14" -B -m unittest discover -s verification/generator_candidates -v 2>&1 | tee "$RUNNER_TEMP/acp-v3-results/successor-tests.log"
          "$RUNNER_TEMP/acp-v3-venv/bin/python3.14" -B - <<'PYTHON'
          import os, re
          from pathlib import Path
          log = (Path(os.environ['RUNNER_TEMP']) / 'acp-v3-results/successor-tests.log').read_text()
          assert re.findall(r'^Ran ([0-9]+) tests in .+$', log, re.MULTILINE) == ['13'], 'SUCCESSOR_EXECUTED_COUNT'
          assert log.rstrip().splitlines()[-1] == 'OK', 'SUCCESSOR_FAILURE_OR_SKIP'
          PYTHON
      - name: Qualify exact reviewed export without physical execution
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/acp-v3-venv/bin/python3.14" -B engineering/ci/phase6_v3_hosted.py \
            --repository "$GITHUB_WORKSPACE" \
            --patch "$GITHUB_WORKSPACE/engineering/ci/inputs/phase6-wave3-cumulative.patch" \
            --export "$RUNNER_TEMP/acp-v3-source" \
            --scratch "$RUNNER_TEMP/acp-v3-scratch" \
            --output "$RUNNER_TEMP/acp-v3-results/offline.json" \
            2>&1 | tee "$RUNNER_TEMP/acp-v3-results/qualification.log"
      - name: Retain offline qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase6-v3-offline-qualification
          path: ${{ runner.temp }}/acp-v3-results/
          if-no-files-found: error

  successor-application-builds:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.14.7'
      - uses: actions/setup-node@v7
        with:
          node-version: '24.21.0'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Provision compiler dependencies on disposable runner
        run: |
          python3.14 -m venv "$RUNNER_TEMP/acp-build-venv"
          "$RUNNER_TEMP/acp-build-venv/bin/python3.14" -m pip install --only-binary=:all: -r tooling/requirements.txt
          "$RUNNER_TEMP/acp-build-venv/bin/python3.14" -m pip check
      - name: Verify build runner contracts
        run: '"$RUNNER_TEMP/acp-build-venv/bin/python3.14" -B -m unittest discover -s verification/generator_builds -v'
      - name: Compile both generated successor applications
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/acp-build-venv/bin/python3.14" -B engineering/generator_builds/qualify.py --workspace "$RUNNER_TEMP/acp-successor-builds" 2>&1 | tee "$RUNNER_TEMP/acp-successor-build.log"
      - name: Retain build identity and actual compiler output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: successor-application-builds
          path: |
            ${{ runner.temp }}/acp-successor-build.log
            ${{ runner.temp }}/acp-successor-builds/results.json
          if-no-files-found: error

  successor-application-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.14.7'
      - uses: actions/setup-node@v7
        with:
          node-version: '24.21.0'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Provision compiler dependencies on disposable runner
        run: |
          python3.14 -m venv "$RUNNER_TEMP/acp-build-venv"
          "$RUNNER_TEMP/acp-build-venv/bin/python3.14" -m pip install --only-binary=:all: -r tooling/requirements.txt
          "$RUNNER_TEMP/acp-build-venv/bin/python3.14" -m pip check
      - name: Verify build runner contracts
        run: '"$RUNNER_TEMP/acp-build-venv/bin/python3.14" -B -m unittest discover -s verification/generator_runtime -v'
      - name: Verify integrated ownership provenance and traceability regressions
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/acp-build-venv/bin/python3.14" -B - <<'PYTHON'
          import unittest
          suite = unittest.defaultTestLoader.discover('verification/traceability')
          assert suite.countTestCases() == 11, 'TRACEABILITY_TEST_COUNT'
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          assert result.wasSuccessful() and result.testsRun == 11 and not result.skipped
          PYTHON
      - name: Obtain exact disposable PostgreSQL runtime
        run: docker pull postgres@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
      # Wrap engineering/generator_builds/runtime.py without changing its assertions or cleanup.
      - name: Exercise both generated applications with fresh isolated databases
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/acp-build-venv/bin/python3.14" -B engineering/traceability/runtime.py --workspace "$RUNNER_TEMP/acp-successor-runtime" 2>&1 | tee "$RUNNER_TEMP/acp-successor-runtime.log"
      - name: Retain runtime results and browser logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: successor-application-runtime
          path: |
            ${{ runner.temp }}/acp-successor-runtime.log
            ${{ runner.temp }}/acp-successor-runtime/runtime-results.json
            ${{ runner.temp }}/acp-successor-runtime/traceability-results.json
            ${{ runner.temp }}/acp-successor-runtime/*-runtime/
          if-no-files-found: error

  successor-dependency-determinism:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.14.7'
      - uses: actions/setup-node@v7
        with:
          node-version: '24.21.0'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Provision existing hash-pinned compiler wheels in disposable runner
        shell: bash
        run: |
          set -euo pipefail
          python3.14 -m venv "$RUNNER_TEMP/acp-dependency-venv"
          python3.14 -m pip download --require-hashes --only-binary=:all: -r engineering/dependency_resolution/compiler-requirements.txt -d "$RUNNER_TEMP/acp-compiler-wheels"
          "$RUNNER_TEMP/acp-dependency-venv/bin/python3.14" -m pip install --no-index --find-links "$RUNNER_TEMP/acp-compiler-wheels" --require-hashes --only-binary=:all: -r engineering/dependency_resolution/compiler-requirements.txt
          "$RUNNER_TEMP/acp-dependency-venv/bin/python3.14" -m pip check
      - name: Reject dependency substitutions and mutable resolution
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/acp-dependency-venv/bin/python3.14" -B - <<'PYTHON'
          import unittest
          from pathlib import Path
          folder = Path('verification/dependency_resolution')
          assert {p.name for p in folder.glob('test*.py')} == {'test_inputs.py'}
          suite = unittest.defaultTestLoader.discover(str(folder))
          assert suite.countTestCases() == 24
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          assert result.wasSuccessful() and result.testsRun == 24 and not result.skipped
          PYTHON
      - name: Resolve once and freeze all runtime compiler and plugin inputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/acp-empty-m2" "$RUNNER_TEMP/acp-empty-npm"
          "$RUNNER_TEMP/acp-dependency-venv/bin/python3.14" -B engineering/dependency_resolution/qualify.py prepare --workspace "$RUNNER_TEMP/acp-dependency-qualification" --maven-seed "$RUNNER_TEMP/acp-empty-m2" --npm-seed "$RUNNER_TEMP/acp-empty-npm" --wheels "$RUNNER_TEMP/acp-compiler-wheels" --online-acquire 2>&1 | tee "$RUNNER_TEMP/acp-dependency-prepare.log"
      - name: Build both applications twice offline from independently clean exports
        shell: bash
        run: |
          set -euo pipefail
          read -r lock_digest < "$RUNNER_TEMP/acp-dependency-qualification/dependency-lock.sha256"
          "$RUNNER_TEMP/acp-dependency-venv/bin/python3.14" -B engineering/dependency_resolution/qualify.py qualify --workspace "$RUNNER_TEMP/acp-dependency-qualification" --expected "$lock_digest" 2>&1 | tee "$RUNNER_TEMP/acp-dependency-qualify.log"
      - name: Preserve exact inputs and independent clean-build outcomes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: successor-dependency-determinism
          path: |
            ${{ runner.temp }}/acp-dependency-prepare.log
            ${{ runner.temp }}/acp-dependency-qualify.log
            ${{ runner.temp }}/acp-dependency-qualification/*.json
            ${{ runner.temp }}/acp-dependency-qualification/*.sha256
            ${{ runner.temp }}/acp-dependency-qualification/*.log
            ${{ runner.temp }}/acp-dependency-qualification/clean-*/*.log
            ${{ runner.temp }}/acp-dependency-qualification/clean-*/results.json
          if-no-files-found: error
