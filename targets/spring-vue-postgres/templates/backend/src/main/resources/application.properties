spring.application.name=acp-generated-application
spring.datasource.url=${ACP_DATABASE_URL}
spring.datasource.username=${ACP_DATABASE_USER}
spring.datasource.password=${ACP_DATABASE_PASSWORD}
spring.security.oauth2.resourceserver.jwt.issuer-uri=${ACP_OIDC_ISSUER}
spring.security.oauth2.resourceserver.jwt.audiences=${ACP_OIDC_AUDIENCE}
spring.flyway.enabled=true
spring.flyway.clean-disabled=true
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
logging.structured.format.console=ecs
server.error.include-message=never
server.error.include-stacktrace=never
spring.mvc.log-request-details=false
logging.level.org.springframework.jdbc.core=OFF
logging.level.org.springframework.web=ERROR

# Raw provider/SQL/framework exception logging is not a classified export port.
# Trusted exporters must use PrivacyGuards.observability; verification OUTSTANDING.
logging.level.org.springframework=OFF
logging.level.org.hibernate=OFF
logging.level.org.postgresql=OFF
spring.mvc.log-request-details=false
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
